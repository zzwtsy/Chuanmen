[package]
name = "chuanmen-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace]

[lib]
name = "chuanmen_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
easytier = { path = "../build/native/upstream/easytier", default-features = true, features = ["tracing-log"] }
easytier-core = { path = "../build/native/upstream/easytier-core", default-features = true }
easytier-ffi = { path = "../build/native/upstream/easytier-contrib/easytier-ffi", default-features = false }
async-trait = "0.1.92"
jni = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
