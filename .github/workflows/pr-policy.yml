name: PR policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR metadata from event file
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const pr = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).pull_request;
          const titlePattern = /^(feat|fix|docs|refactor|perf|test|build|ci|style|chore|revert)(\([^\s()]+\))?!?: [^\s].*$/u;
          if (!pr || pr.base.ref !== 'main' || typeof pr.title !== 'string' || !titlePattern.test(pr.title)) {
            console.error('PR 必须以 main 为目标，并使用 Conventional Commits 标题。');
            process.exit(1);
          }
          JS
