name: Android foundation

on:
  push:
    paths: ['app/**', 'contracts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', 'scripts/android/**', 'scripts/catalog/**', 'docs/design/config/**', 'ruff.toml', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'contracts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', 'scripts/android/**', 'scripts/catalog/**', 'docs/design/config/**', 'ruff.toml', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_CLI_VERSION: '1.0.16500706'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Install Android CLI and declared SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_cli_dir="$RUNNER_TEMP/android-cli"
          android_cli_url="https://dl.google.com/android/cli/${ANDROID_CLI_VERSION}/linux_x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$android_cli_dir"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "$android_cli_url/android" --output "$android_cli_dir/android"
          chmod +x "$android_cli_dir/android"
          export ANDROID_CLI_DOWNLOAD_URL="$android_cli_url/android-cli"
          printf '%s\n' "$android_cli_dir" >> "$GITHUB_PATH"
          printf '%s\n' \
            "ANDROID_USER_HOME=$ANDROID_USER_HOME" \
            "ANDROID_HOME=$ANDROID_HOME" \
            "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" \
            "ANDROID_CLI_DOWNLOAD_URL=$ANDROID_CLI_DOWNLOAD_URL" >> "$GITHUB_ENV"
          "$android_cli_dir/android" --no-metrics --version
          "$android_cli_dir/android" --no-metrics --sdk="$ANDROID_HOME" sdk install \
            'platforms/android-37.0' 'build-tools/36.0.0' 'platform-tools'
      - name: Diagnose toolchain
        run: ./scripts/android/doctor.sh
      - name: Check contracts and JVM behavior
        run: ./scripts/android/check-fast.sh
      - name: Build demo APK
        run: ./scripts/android/build-demo.sh
      - name: Compile demo device tests
        run: ./gradlew --console=plain :app:assembleDemoDebugAndroidTest
