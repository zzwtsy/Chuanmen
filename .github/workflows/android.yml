name: Android foundation

on:
  push:
    paths: ['app/**', 'contracts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', 'scripts/android/**', 'scripts/catalog/**', 'docs/design/config/**', 'ruff.toml', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'contracts/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew', 'scripts/android/**', 'scripts/catalog/**', 'docs/design/config/**', 'ruff.toml', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Install declared SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Diagnose toolchain
        run: ./scripts/android/doctor.sh
      - name: Check contracts and JVM behavior
        run: ./scripts/android/check-fast.sh
      - name: Build demo APK
        run: ./scripts/android/build-demo.sh
      - name: Compile demo device tests
        run: ./gradlew --console=plain :app:assembleDemoDebugAndroidTest
