name: Android and native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_CLI_VERSION: '1.0.16500706'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Install Android CLI and declared SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_cli_dir="$RUNNER_TEMP/android-cli"
          android_cli_url="https://dl.google.com/android/cli/${ANDROID_CLI_VERSION}/linux_x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$android_cli_dir"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "$android_cli_url/android" --output "$android_cli_dir/android"
          chmod +x "$android_cli_dir/android"
          export ANDROID_CLI_DOWNLOAD_URL="$android_cli_url/android-cli"
          printf '%s\n' "$android_cli_dir" >> "$GITHUB_PATH"
          printf '%s\n' \
            "ANDROID_USER_HOME=$ANDROID_USER_HOME" \
            "ANDROID_HOME=$ANDROID_HOME" \
            "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" \
            "ANDROID_CLI_DOWNLOAD_URL=$ANDROID_CLI_DOWNLOAD_URL" >> "$GITHUB_ENV"
          "$android_cli_dir/android" --no-metrics --version
          "$android_cli_dir/android" --no-metrics --sdk="$ANDROID_HOME" sdk install \
            'platforms/android-37.0' 'build-tools/36.0.0' 'platform-tools' 'ndk/30.0.16248370'
      - name: Diagnose toolchain
        run: ./scripts/android/doctor.sh
      - name: Check contracts and JVM behavior
        run: ./scripts/android/check-fast.sh
      - name: Build demo APK
        run: ./scripts/android/build-demo.sh
      - name: Compile demo device tests
        run: ./gradlew --console=plain :app:assembleDemoDebugAndroidTest
      - name: Install fixed native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes protobuf-compiler libssl-dev pkg-config clang cmake
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt \
            --target aarch64-linux-android --target x86_64-linux-android
          printf '%s\n' 'RUSTUP_TOOLCHAIN=1.99.0' >> "$GITHUB_ENV"
          rustup run 1.99.0 cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build fixed dual ABI native host
        run: python3 scripts/native/build_native.py build --sdk "$ANDROID_HOME" --allow-download
      - name: Verify native ownership and bridge contracts
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          python3 experiments/p02-vpn-core/check_review.py
          python3 experiments/p02-vpn-core/test_check_review.py
          python3 experiments/p02-vpn-core/test_review.py
          cargo test --manifest-path native/Cargo.toml --locked
          cargo test --manifest-path experiments/p02-vpn-core/native-peer/Cargo.toml --locked --target-dir native/target
          python3 scripts/native/build_native.py verify-artifacts
          ./scripts/android/doctor.sh --native
      - name: Build formal live APK and compile device contracts
        run: ./gradlew --console=plain :app:assembleLiveDebug :app:assembleLiveDebugAndroidTest :app:testLiveDebugUnitTest :app:testLiveReleaseUnitTest
      - name: Verify packaged native identity and 16 KB alignment
        run: python3 scripts/native/check_apk.py --sdk "$ANDROID_HOME" app/build/outputs/apk/live/debug/app-live-debug.apk
