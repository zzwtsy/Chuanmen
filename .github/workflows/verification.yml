name: Verification evidence

on:
  push:
    paths: ['docs/**', 'experiments/**', 'scripts/**', '.agents/skills/verification-evidence/**', '.agents/skills/easytier-config-audit/**', '.github/workflows/verification.yml', 'ruff.toml', 'AGENTS.md', 'README.md', 'handoff.json', 'SHA256SUMS']
  pull_request:
    paths: ['docs/**', 'experiments/**', 'scripts/**', '.agents/skills/verification-evidence/**', '.agents/skills/easytier-config-audit/**', '.github/workflows/verification.yml', 'ruff.toml', 'AGENTS.md', 'README.md', 'handoff.json', 'SHA256SUMS']

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Check Python lint and formatting
        run: |
          uv tool run --isolated --no-python-downloads --from ruff==0.17.0 ruff check --no-cache scripts experiments
          uv tool run --isolated --no-python-downloads --from ruff==0.17.0 ruff format --no-cache --check scripts experiments
      - name: Check privacy and evidence contracts
        run: |
          python3 scripts/verification/check-privacy.py
          python3 scripts/verification/test-evidence.py
          python3 scripts/verification/check-evidence.py --stage p00 --require-stage
          python3 scripts/catalog/test_audit_config_catalog.py
          python3 scripts/catalog/audit_config_catalog.py
          python3 experiments/android-vpn-smoke/test_workflow.py
          python3 scripts/validate_handoff.py --strict
