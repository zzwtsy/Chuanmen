name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Check Python, privacy and configuration catalog
        run: |
          uv tool run --isolated --no-python-downloads --from ruff==0.17.0 ruff check --no-cache scripts
          uv tool run --isolated --no-python-downloads --from ruff==0.17.0 ruff format --no-cache --check scripts
          python3 scripts/check_privacy.py
          python3 scripts/catalog/audit_config_catalog.py
          python3 scripts/test_check_privacy.py
          python3 -m unittest discover -s scripts/catalog -p 'test_*.py'
          python3 -m unittest discover -s scripts/native -p 'test_*.py'
          python3 -m unittest discover -s scripts/android -p 'test_*.py'

  android:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_CLI_VERSION: '1.0.16500706'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            **/*.lockfile
            gradle/dependency-locks/**
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install Android CLI and declared SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_cli_dir="$RUNNER_TEMP/android-cli"
          android_cli_url="https://dl.google.com/android/cli/${ANDROID_CLI_VERSION}/linux_x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$android_cli_dir"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            "$android_cli_url/android" --output "$android_cli_dir/android"
          chmod +x "$android_cli_dir/android"
          export ANDROID_CLI_DOWNLOAD_URL="$android_cli_url/android-cli"
          printf '%s\n' "$android_cli_dir" >> "$GITHUB_PATH"
          printf '%s\n' \
            "ANDROID_USER_HOME=$ANDROID_USER_HOME" \
            "ANDROID_HOME=$ANDROID_HOME" \
            "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" \
            "ANDROID_CLI_DOWNLOAD_URL=$ANDROID_CLI_DOWNLOAD_URL" >> "$GITHUB_ENV"
          "$android_cli_dir/android" --no-metrics --version
          "$android_cli_dir/android" --no-metrics --sdk="$ANDROID_HOME" sdk install \
            'platforms/android-37.0' 'build-tools/36.0.0' 'platform-tools'
      - name: Check JVM behavior and Android lint
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:lintRelease
      - name: Restore Cargo dependency and cargo-ndk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-cargo-ndk-4.1.2-${{ hashFiles('app/native/Cargo.lock', 'scripts/android/native-peer/Cargo.lock', 'app/native/inputs.json') }}
      - name: Install fixed native toolchain
        shell: bash
        run: |
          set -euo pipefail
          android --no-metrics --sdk="$ANDROID_HOME" sdk install 'ndk/30.0.16248370'
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            protobuf-compiler libprotobuf-dev libssl-dev pkg-config clang cmake
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt \
            --target aarch64-linux-android --target x86_64-linux-android
          printf '%s\n' 'RUSTUP_TOOLCHAIN=1.99.0' >> "$GITHUB_ENV"
          installed_ndk_version="$(rustup run 1.99.0 cargo ndk --version 2>/dev/null || true)"
          if [[ "$installed_ndk_version" != "cargo-ndk 4.1.2" ]]; then
            rustup run 1.99.0 cargo install cargo-ndk --version 4.1.2 --locked --force
          fi
          test "$(rustup run 1.99.0 cargo ndk --version)" = 'cargo-ndk 4.1.2'
      - name: Prepare fixed native dependencies and libraries
        run: |
          if ! python3 scripts/native/build_native.py build --sdk "$ANDROID_HOME" --allow-download; then
            for log in app/build/native/build-*.log; do
              if [[ -f "$log" ]]; then
                tail -n 120 "$log"
              fi
            done
            exit 1
          fi
      - name: Check native and controlled peer contracts
        run: |
          cargo test --manifest-path app/native/Cargo.toml --locked --target-dir app/build/native/target
          cargo test --manifest-path scripts/android/native-peer/Cargo.toml --locked --target-dir app/build/device-tests/peer-target
      - name: Check configuration codec through host JNI
        run: ./gradlew --console=plain :app:testHostNativeCodec --offline
      - name: Build debug, release and device tests
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Verify packaged dual ABI libraries and 16 KB alignment
        run: |
          python3 scripts/native/check_apk.py --sdk "$ANDROID_HOME" app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/native/check_apk.py --sdk "$ANDROID_HOME" app/build/outputs/apk/release/app-release-unsigned.apk

  quality-gate:
    name: quality-gate
    if: always()
    needs: [static, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        shell: bash
        run: |
          test "$STATIC_RESULT" = success
          test "$ANDROID_RESULT" = success
