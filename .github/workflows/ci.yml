name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android_required: ${{ steps.classify.outputs.android_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Classify changes
        id: classify
        run: python3 scripts/git/workflow_policy.py changes

  verification:
    uses: ./.github/workflows/verification.yml

  android:
    needs: changes
    if: needs.changes.outputs.android_required == 'true'
    uses: ./.github/workflows/android.yml

  quality-gate:
    name: quality-gate
    if: always()
    needs: [changes, verification, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Require expected check results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/git/workflow_policy.py gate
