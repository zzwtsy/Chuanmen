[package]
name = "chuanmen-controlled-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace]

[dependencies]
easytier = { path = "../../../app/build/native/upstream/easytier", default-features = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
panic = "abort"
